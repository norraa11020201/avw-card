.tagline { margin: 0.7rem 0 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
.cta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; width: 100%; margin-top: 1.2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 3.25rem; padding: 0.5rem 0.8rem; border-radius: 999px; font: 600 1rem/1.2 var(--font); cursor: pointer; border: 1px solid var(--edge); background: var(--chip); color: var(--fg); text-align: center; }
.btn svg { width: 1.2rem; height: 1.2rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn-solid { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn:active { opacity: 0.8; transform: scale(0.98); }

/* Link list */
.list { margin: 0; padding: 0.35rem 0; list-style: none; }
.row { display: flex; align-items: center; gap: 0.9rem; width: 100%; min-height: 4rem; padding: 0.5rem 1.1rem; background: transparent; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; position: relative; }
.row:active { background: var(--card2); }
.list li + li .row::before { content: ""; position: absolute; top: 0; left: 4.6rem; right: 1.1rem; height: 1px; background: var(--edge); }
.ico { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--chip); border: 1px solid var(--edge); color: var(--fg); }
.ico svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.txt { flex: 1; min-width: 0; display: grid; }
.txt b { font-weight: 600; font-size: 1.02rem; }
.txt small { color: var(--sec); font-size: 0.82rem; overflow-wrap: anywhere; }
.tail { flex: none; color: var(--sec); display: grid; place-items: center; }
.tail svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tail.act { font-size: 0.85rem; font-weight: 600; color: var(--fg); }

/* Footer */
.foot { display: grid; justify-items: center; gap: 0.5rem; margin-top: 0.5rem; }

.plain { background: transparent; border: 0; padding: 0 1rem; min-height: 2.75rem; color: var(--fg); font: 600 0.95rem/1 var(--font); cursor: pointer; }
.plain:active { opacity: 0.55; }

/* QR sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto 1fr; overflow-y: auto;
  background: rgba(15, 15, 15, 0.92);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 3.2rem; }
.bar h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.bar button { justify-self: end; background: transparent; border: 0; color: var(--fg); font: 700 1.05rem/1 var(--font); min-height: 2.75rem; padding-inline: 0.25rem; cursor: pointer; }
.sheet-body { display: grid; place-content: center; justify-items: center; gap: 1.1rem; text-align: center; padding-block: 1rem 2rem; min-width: 0; }
.qtile { background: var(--tile); padding: 0.9rem; border-radius: 1.75rem; width: min(86vw, 58vh, 24rem); }
.qtile svg { display: block; width: 100%; height: auto; }
.qwho { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.qwho span { color: var(--sec); font-weight: 500; margin-left: 0.3rem; }
.qurl { margin: 0; color: var(--sec); font-size: 0.75rem; overflow-wrap: anywhere; max-width: 22rem; user-select: all; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: #ffffff; color: #000000; padding: 0.65rem 1.2rem; border-radius: 2rem; font-size: 0.95rem; font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .row, .plain { transition: background 0.15s, opacity 0.15s, transform 0.15s; }
}
</style>

<style>
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg .p{position:absolute;display:block;width:calc(clamp(72px,21vmin,190px)*var(--k));height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:drift 12s ease-in-out infinite;opacity:.92}
.bg .p.soft{filter:blur(7px) brightness(.7);opacity:.75}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(15,15,15,.6) 0%,rgba(15,15,15,.25) 55%,rgba(15,15,15,0) 80%)}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.bg .p{animation:none}}
.page{position:relative;z-index:1}
.hero.glass{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
html{font-size:clamp(10px,calc(100vh/52),16px);font-size:clamp(10px,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/51),16px)}
body{display:flex;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:.5rem}
.page{margin:auto;width:100%}
.lockup{width:min(100%,9rem)}
.foot{gap:.6rem}
.copy{margin:0;color:var(--sec);font-size:.72rem;letter-spacing:.02em;opacity:.85}
.glass{background:rgba(27,27,27,.66);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var sheet = document.getElementById('sheet');
  var tile = document.getElementById('qr-tile');
  var urlEl = document.getElementById('qr-url');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var wakeLock = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }

  function pageUrl() { return 'https://kim.avwgrading.com/'; }

  function buildQR(text) {
    try {
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount(), q = 4, d = '';
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (qr.isDark(r, c)) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
        }
      }
      var s = n + q * 2;
      return '<svg viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img" aria-label="名片頁面 QR Code">' +
        '<rect width="' + s + '" height="' + s + '" fill="#ffffff"/><path d="' + d + '" fill="#000000"/></svg>';
    } catch (e) { return ''; }
  }

  function openQR() {
    var u = pageUrl();
    var svg = buildQR(u);
    tile.innerHTML = svg || '<p style="color:#000;margin:1rem;">QR Code 暫時無法產生，請直接分享下方網址。</p>';
    urlEl.textContent = u;
    sheet.hidden = false;
    document.getElementById('qr-close').focus();
    try {
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
      }
    } catch (e) {}
  }

  function closeQR() {
    sheet.hidden = true;
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
    document.getElementById('open-qr').focus();
  }

  function selectNode(el) {
    try {
      var rg = document.createRange();
      rg.selectNodeContents(el);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(rg);
    } catch (e) {}
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function copyText(text, targetId) {
    var done = function () { toast('已拷貝'); };
    var fail = function () {
      if (fallbackCopy(text)) { done(); return; }
      if (targetId) selectNode(document.getElementById(targetId));
      toast('請長按選取後拷貝');
    };
    try {
      navigator.clipboard.writeText(text).then(done, fail);
    } catch (e) { fail(); }
  }

  document.getElementById('open-qr').addEventListener('click', openQR);
  document.getElementById('qr-close').addEventListener('click', closeQR);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeQR(); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
    b.addEventListener('click', function () { copyText(b.getAttribute('data-copy'), b.getAttribute('data-target')); });
  });

  var cc = document.getElementById('copy-card'); if (cc) cc.addEventListener('click', function () {
    var text = [
      '曾國良 KIM',
      'Founder, Arcadia Vault Way（AVW）',
      'LINE：https://lin.ee/NxtPg9k',
      'Email：avwcards.cs@gmail.com',
      '官網：https://www.avwgrading.com/',
      'IG：@avwcards / @avwgallery',
      '名片：' + pageUrl()
    ].join('\n');
    copyText(text, null);
  });
})();
</script>
